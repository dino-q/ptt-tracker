name: update-site

# 2026-09-18 Dino 拍板：這個 workflow 不再爬 PTT，只負責把 repo 裡的 site/ 部署到 Pages。
# 原因：PTT 自 2026-09-16 18:50 UTC 起對 GitHub Actions 的機房 IP 回 403 Forbidden
# （同時段同一支程式從本機出去是 200），連續 7 次全掛，且封鎖認的是來源 IP 段，
# 改寫程式、換 Cloudflare 都繞不過。抓取改由本機排程 PTT_Assistant_DailyCache 執行
# （scripts/publish_local.py 產 site/data 後 push），這裡只做部署——部署不連 PTT，不受影響。
# 所以也移除了 schedule：資料是 push 進來的，push 即部署。

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
